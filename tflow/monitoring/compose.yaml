# Linux host networking lets the collectors reach an existing Django process.
# All UIs bind to loopback; expose them only through an authenticated VPN/tunnel.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.listen-address=127.0.0.1:9090, --storage.tsdb.retention.time=15d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./alerts-test.yml:/etc/prometheus/alerts-test.yml:ro
      - ./secrets/metrics-token:/etc/prometheus/token:ro
      - prometheus:/prometheus
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    command: [--config.file=/etc/alertmanager/config.yml, --web.listen-address=127.0.0.1:9093, --cluster.listen-address=]
    volumes:
      - ./secrets/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager:/alertmanager
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    network_mode: host
    command: [--config.file=/etc/blackbox/config.yml, --web.listen-address=127.0.0.1:9115]
    volumes: [./blackbox.yml:/etc/blackbox/config.yml:ro]
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.3
    network_mode: host
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki:/loki
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.10.2
    network_mode: host
    command: [run, --server.http.listen-addr=127.0.0.1:12345, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../backend/data/logs:/logs:ro
      - alloy:/var/lib/alloy/data
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    network_mode: host
    env_file: .env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3001'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    restart: unless-stopped
volumes:
  prometheus:
  alertmanager:
  loki:
  alloy:
  grafana:
