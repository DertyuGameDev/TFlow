<!doctype html>
<html lang="ru"><body style="margin:0;background:#f6f7f8;color:#24272d;font-family:Arial,sans-serif">
<div style="max-width:560px;margin:24px auto;padding:28px;background:#fff;border:1px solid #e5e7eb;border-radius:16px">
  <p style="font-size:24px;font-weight:bold;margin:0 0 24px">ТФлоу<span style="color:#b58f00">.</span></p>
  <h1 style="font-size:22px;line-height:1.4">{{ subject }}</h1>
  <p style="font-size:16px;line-height:1.7">{{ message|linebreaksbr }}</p>
  {% if url %}<p style="margin:28px 0"><a href="{{ url }}" style="display:inline-block;padding:14px 18px;background:#ffdd2d;color:#24272d;text-decoration:none;border-radius:10px;font-weight:bold">Открыть центр уведомлений</a></p>{% endif %}
  <p style="font-size:13px;line-height:1.6;color:#626b78">Это автоматическое уведомление о вашем мероприятии.<br>ТФлоу · События и люди</p>
</div></body></html>
