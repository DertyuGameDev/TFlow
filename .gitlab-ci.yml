# DevPlatform CI, customized for ТФлоу. Keep this file in the repository.
stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "main"'

default:
  interruptible: true

frontend:
  stage: test
  image: node:22-bookworm-slim
  cache:
    key:
      files: [tflow/package-lock.json]
    paths: [tflow/.npm/]
  script:
    - cd tflow
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run check
    - npm run test:frontend
    - npm run build
  artifacts:
    expire_in: 7 days
    paths: [tflow/dist/]

backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # Disposable CI database; production credentials are never used in tests.
    POSTGRES_DB: tflow_ci
    POSTGRES_USER: tflow_ci
    POSTGRES_PASSWORD: tflow_ci_test_only
    DATABASE_URL: postgresql://tflow_ci:tflow_ci_test_only@postgres:5432/tflow_ci
    DJANGO_DEBUG: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files: [tflow/backend/requirements.lock.txt]
    paths: [.cache/pip/]
  script:
    - python -m pip install -r tflow/backend/requirements.lock.txt
    - python -m unittest discover -s tflow/deploy/spirit -p 'test_*.py'
    - python -m unittest discover -s tflow/deploy/sync -p 'test_*.py'
    - cd tflow/backend
    - python manage.py makemigrations --check --dry-run
    - python manage.py test flow.tests --noinput

package:
  stage: build
  image: python:3.12-slim
  needs:
    - job: frontend
      artifacts: true
    - job: backend
      artifacts: false
  script:
    - python tflow/scripts/package-release.py
  artifacts:
    name: "tflow-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - release/tflow-release.tar.gz
      - release/manifest.json

# Configure protected FILE variables TFLOW_VM_SSH_KEY and TFLOW_VM_KNOWN_HOSTS.
# Set TFLOW_CONFIGURE_VIDEO=1 for the managed same-VM LiveKit installation.
deploy_vm:
  stage: deploy
  image: python:3.12-slim
  interruptible: false
  resource_group: tflow-spirit-vm1
  needs:
    - job: package
      artifacts: true
  environment:
    name: production-vm
    url: https://hack-mmk-25-vm1-162f2c.vm.prodcontest.com
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TFLOW_VM_SSH_KEY && $TFLOW_VM_KNOWN_HOSTS'
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends openssh-client ca-certificates
  script:
    - python tflow/deploy/spirit/deploy-ci.py

# Explicit deployment of the verified artifact. External HTTPS is a required
# check inside this job; an unsuccessful deployment is visible on production.
deploy-spirit:
  stage: deploy
  image: python:3.12-slim
  interruptible: false
  resource_group: tflow-spirit-vm1
  timeout: 15m
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: package
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production
    url: https://hack-mmk-25-vm1-162f2c.vm.prodcontest.com
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends openssh-client git ca-certificates
  script:
    - python tflow/deploy/spirit/deploy.py release/manifest.json release/tflow-release.tar.gz

deploy-spirit-cu:
  extends: deploy-spirit
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  environment:
    name: spirit-production
    url: https://hack-mmk-25-vm1-162f2c.teleport.t-education.com
  script:
    - python tflow/deploy/spirit/deploy.py release/manifest.json release/tflow-release.tar.gz --gateway

# Maintenance uses the existing tenant-scoped Spirit CI identity. No key or
# token is printed or stored in artifacts; only the public CLI is retained.
.spirit-control:
  stage: deploy
  image: python:3.12-slim
  interruptible: false
  resource_group: tflow-spirit-vm1
  timeout: 12m
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

spirit-readiness:
  extends: .spirit-control
  script:
    - python tflow/deploy/spirit/control.py inspect
    - python tflow/deploy/spirit/check_video_network_policy.py
  artifacts:
    expire_in: 1 day
    paths: [.spirit-cli/dp]

provision-owned-video:
  extends: .spirit-control
  timeout: 15m
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends openssh-client ca-certificates certbot
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TFLOW_MEDIA_RENEWAL == "1"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - python tflow/deploy/spirit/provision_video.py

spirit-recover-network:
  extends: .spirit-control
  needs:
    - job: spirit-readiness
      artifacts: true
  script:
    - python tflow/deploy/spirit/control.py power-cycle

# Requires an explicit SPIRIT_REBUILD_CONFIRM=<vm1 UUID> when starting the job.
# An off-VM backup and owner consent must exist before this destructive action.
spirit-rebuild-authorized:
  extends: .spirit-control
  timeout: 20m
  needs:
    - job: spirit-readiness
      artifacts: true
  script:
    - python tflow/deploy/spirit/control.py rebuild
